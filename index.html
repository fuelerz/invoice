<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Dashboard - Fuelerz Studio</title>
  <style>
    :root {
      --primary: #7c3aed;
      --black: #0f172a;
      --gray: #64748b;
      --light: #f8fafc;
      --border: #e2e8f0;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--light);
      color: var(--black);
      padding: 40px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.05);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
    }
    .client-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .client-card {
      display: block;
      padding: 20px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }
    .client-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.1);
      transform: translateY(-2px);
    }
    .client-card h3 {
      font-size: 16px;
      margin: 0 0 5px 0;
      color: var(--primary);
    }
    .client-card p {
      font-size: 13px;
      color: var(--gray);
      margin: 0;
    }
    .add-new {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background: var(--black);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .add-new:hover {
      background: var(--primary);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Fuelerz Studio - Invoices</h1>
      <img src="logo.png" alt="Fuelerz Logo" style="height: 40px;">
    </div>

    <div class="client-grid">
      <!-- Clients Retrieved from Fuelerz.com -->
      <a href="cbcgoa.html" class="client-card">
        <h3>CBC Goa</h3>
        <p>Printing and business services</p>
      </a>
      
      <a href="dovenest.html" class="client-card">
        <h3>Dove Nest</h3>
        <p>Farm stay and events</p>
      </a>
      
      <a href="shaanperfume.html" class="client-card">
        <h3>Shaan Perfume</h3>
        <p>Perfume retail website</p>
      </a>
      
      <a href="nesbakes.html" class="client-card">
        <h3>Nesbakes</h3>
        <p>Bakery and food brand</p>
      </a>

      <!-- Additional Client Directories -->
      <a href="mancave.html" class="client-card">
        <h3>Mancave Goa</h3>
        <p>Apparel / Lifestyle</p>
      </a>

      <a href="tanaafoods.html" class="client-card">
        <h3>Tanaa Foods</h3>
        <p>F&B Retail</p>
      </a>
    </div>

    <a href="template.html" class="add-new">+ Create New Invoice</a>
  </div>

</body>
</html>
